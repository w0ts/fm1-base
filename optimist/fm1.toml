# SPDX-License-Identifier: GPL-3.0-only
# Optimist on fm1-base, the trial (milestone 1: the audio core in the host simulator; milestone 2: its UI on fm1-base's
# canvas and panel). Optimist's code: GPL-3.0-only,
# never offered upstream as MPL. optimist/run.sh (tools/build.py optimist --host with Terminus, then the tests)
name = "optimist"
id_prefix = "FM-1_79"          # a trial identity (dev FM-1_7900), not Optimist's FM-1_700
usb_manufacturer = "Optimist"
usb_product = "Optimist trial FM-1"
o2 = ["core/opt_core.c", "core/opt_fpu_*.c"]
                               # Optimist's audio core and UI (ui/opt_ui.c): a unit of its own (its names never meet
                               # fm1-base's; fm1-base's canvas, device/gfx.c, compiled into it); opt_fpu_*: ACID, ANALOG
                               # 2's filter models and the X0X kits, float units of their own on the FM-1 (as Optimist
                               # builds them), empty on the host (inside opt_core.c there)
o2_include = ["build/optgen/felucca_config.h"]   # the build's switches (gen_optimist.py: the profile copy through Optimist's builder)
include = ["build/optimist/firmware/src", "build/optgen"]   # Optimist's tree (gen_optimist.py links it), its headers
ir_pass = "ir_pass.py"        # Optimist's tools/size_fns.py on its unit (the UI at minsize, the rest -Os: as Optimist builds felucca.c)
gen = ["gen_optimist.py"]      # the link to Optimist's tree and its generated headers (build/optgen)
words = "words.tsv"
font_full = ["L"]              # the large face with lower case (Optimist's questions in sentence case: op_graph.c font_big)
# USB audio as Optimist's own presents it (io/usb, from Melodee): two devices, "Optimist Out" (the computer plays,
# the USB input track: APP_USB_PLAY) and "Optimist In" (it records four channels, CH1..CH4, by SYSTEM > USB AUDIO's
# routing: APP_USB_CAPTURE), 16- and 24-bit both ways; the input on the computer's clock, the output on the FM-1's
# (its feedback): fm1-base's USB audio (felucca-bsp's UAC)
usb_audio_in_channels = 4
usb_audio_in_24bit = true
usb_audio_in_host_clock = true
usb_audio_out_feedback = true
usb_audio_out_24bit = true
usb_audio_split = true
usb_audio_in_name = "Optimist In"
usb_audio_out_name = "Optimist Out"
usb_audio_in_channel_names = ["CH1", "CH2", "CH3", "CH4"]
# The second core: Optimist's DUAL (the profile's: its split of the render, core/opt_dual.c) on fm1-base's (plat_cpu2_*,
# felucca-bsp's chip/fm1_cpu1.h). Optimist's rule on a failure: one core from then on, never a restart (cpu2_fallback)
xdata2 = true                  # Optimist's globals 0xFC000..0xFEFFF (its settings A/B, its autosave's copy B): plat.h's fourth
                               # plat_data window, PLAT_XDATA2 (its store objects are elsewhere: APP_STORE_MAP 0xD8000)
cpu2 = true
cpu2_fallback = true
cpu2_stack = 4096              # (felucca-bsp's 2,816 B less its 256 B guard: under the 2.5 KB an engine's job reaches; 4096
                               # leaves Optimist's own room, 3,840 B: tools/build.py CPU1_STACK_ROOM there)
ble = false                    # milestone 1: no Bluetooth (fm1-base's own stack is Optimist's: a later step)
companion = true               # fm1-base's companion services (docs/COMPANION.md): what this FM-1 runs, Optimist's backup
                               # objects and sample slots as its files (in place of its editor's own cmds 43..48, 11..15:
                               # Optimist's io/editor/ed_comp.c), a few of its parameters (app.h APP_FILES, APP_PARAMS; app.c)
emu = ["port"]                 # the browser emulator as a MIDI port for this site's other pages (web/emu/parts/port.js):
                               # Optimist's web editor's "fm1-base emulator" device, the companion page
# The audio path's calls out of RAM code through a pointer (tools/ramcode.py), every one of them Optimist's own: its
# firmware runs the same functions from RAM (its .ram_hot / .ram_hot2: core.h HOT, HOT2, OVL as HOT without the
# overlays) and makes the same calls into XIP (FAR, the engines' and effects' function tables), with its rule that HOT
# code reaches XIP only that way. Safe here for the same reason as there: the XIP flash is on whenever audio renders.
# The render runs in the audio interrupt, and fm1-base turns the flash off only inside its flash driver with the
# interrupts off (each 256-byte page write, each ~1 ms window of a sliced erase: plat.h plat_data_erase); between the
# windows the erase is suspended and the XIP reads again, so saving while playing (LIVE_SAVE, on in its profile copy)
# renders with the flash on, as Optimist's own. The names are checked to be RAM functions at every build, and every
# build prints them.
ram_code_allow = [
    # the render's block (fx.c): the engines' and drums' hooks, the envelopes' and LFOs' cold parts, the sequencer's
    # events, the resampler's block, the meters' and scope's taps (all XIP on Optimist, called through FAR or a table)
    "mix_block",
    # ANALOG / ANALOG 2 (eng_analog*.c): the float filter models (a2_models.c a2m_block, a float unit in XIP as on
    # Optimist); a2_filter's table of SVF kernels (A2_FLT, A2_FLT_I) holds RAM code (OVL), here and on Optimist
    "analog_render", "a2_fltb", "a2_filter",
    # the effect buses (fx.c): the reverb's rare clear and parameters, the delay's block, the returns' zeroing, the
    # distortion's gains, the drum inserts' rest
    "rev_post", "rev_bus", "dly_run", "fx_ret_block", "dist_run", "dins_of",
    # the insert effects (insfx/*.c): their marks and widths, the gater's block, the limiter's chorus, the drive's gains
    "ifx_st", "ifx_part", "ifx_quiet_part", "ifx_bus", "ifx_gater", "ifx_lim_run", "ifx_drive",
    # the USB input track (fx.c ut_mix): the computer's audio through FAR(ua_take), RAM code here (core/opt_core.c, HOT;
    # usb_audio_stream.c's, XIP, on Optimist), so the call stays in RAM; the checker cannot see a pointer's target
    "ut_mix",
    # the second core's split (core/opt_dual.c, system/dual.c's): dual_run renders a block's jobs on either core, the
    # parts (mix_part inlined: the same calls as mix_block's) and the drums (their hooks, the SCOPE's taps), and times
    # each through plat_ticks24 (FAR: the clock is flash code); dual_job, the second core's job, the same clock
    "dual_run", "dual_job",
]
licence = "GPL-3.0-only"
credits = "Optimist (GPL-3.0-only), from SLOOP and Felucca, on fm1-base (MPL-2.0)"
